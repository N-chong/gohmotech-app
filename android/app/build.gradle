apply plugin: 'com.android.application'

def gohMoTechSigningPropertiesFile = rootProject.file('signing.properties')
def gohMoTechSigningProperties = new Properties()
if (gohMoTechSigningPropertiesFile.isFile()) {
    gohMoTechSigningPropertiesFile.withInputStream { stream ->
        gohMoTechSigningProperties.load(stream)
    }
}

def gohMoTechSigningKeys = [
    'GOHMOTECH_KEYSTORE_PATH',
    'GOHMOTECH_KEYSTORE_PASSWORD',
    'GOHMOTECH_KEY_ALIAS',
    'GOHMOTECH_KEY_PASSWORD'
]
def gohMoTechSigningValues = gohMoTechSigningKeys.collectEntries { key ->
    def value = project.findProperty(key)?.toString()?.trim()
    if (!value) {
        value = gohMoTechSigningProperties.getProperty(key)?.trim()
    }
    [(key): value]
}
def gohMoTechMissingSigningKeys = gohMoTechSigningKeys.findAll { !gohMoTechSigningValues[it] }
def gohMoTechReleaseKeystore = gohMoTechSigningValues.GOHMOTECH_KEYSTORE_PATH ?
    rootProject.file(gohMoTechSigningValues.GOHMOTECH_KEYSTORE_PATH) : null

android {
    namespace = "com.gohmotech.owner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gohmotech.owner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (gohMoTechMissingSigningKeys.isEmpty()) {
            release {
                storeFile gohMoTechReleaseKeystore
                storePassword gohMoTechSigningValues.GOHMOTECH_KEYSTORE_PASSWORD
                keyAlias gohMoTechSigningValues.GOHMOTECH_KEY_ALIAS
                keyPassword gohMoTechSigningValues.GOHMOTECH_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (gohMoTechMissingSigningKeys.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all {
                outputFileName = "GoHMoTech-${variant.versionName}-release.apk"
            }
        }
    }
}

def validateGohMoTechReleaseSigning = tasks.register('validateGohMoTechReleaseSigning') {
    group = 'verification'
    description = 'Fails release builds unless the permanent GoHMoTech signing key is configured.'
    doLast {
        if (!gohMoTechMissingSigningKeys.isEmpty()) {
            throw new GradleException(
                "GoHMoTech release signing is not configured. Copy signing.properties.example " +
                "to signing.properties and define: ${gohMoTechMissingSigningKeys.join(', ')}."
            )
        }
        if (!gohMoTechReleaseKeystore?.isFile()) {
            throw new GradleException(
                'The configured GoHMoTech release keystore does not exist or is not a file.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(validateGohMoTechReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
